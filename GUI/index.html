<!DOCTYPE html>
<html>
<head>
    <title>Social Media Post Scheduler</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(181, 94, 103, 0.1);
        }

        h1 {
            color: #B55E67;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #FEC933;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
            color: #333;
        }

        select:focus, input[type="datetime-local"]:focus {
            outline: none;
            border-color: #B55E67;
            box-shadow: 0 0 0 3px rgba(181, 94, 103, 0.1);
        }

        .image-upload {
            border: 2px dashed #FEC933;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-upload:hover {
            border-color: #B55E67;
            background: rgba(181, 94, 103, 0.05);
        }

        #selectImage {
            background: #81D4FA;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        #selectImage:hover {
            background: #5cb8e6;
            transform: translateY(-2px);
        }

        #selectedImage {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
            word-break: break-all;
        }

        #submitButton {
            background: #B55E67;
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submitButton:hover {
            background: #a34d55;
            transform: translateY(-2px);
        }

        #submitButton:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success {
            background-color: rgba(171, 212, 81, 0.1);
            color: #ABD451;
            border: 1px solid #ABD451;
        }

        .error {
            background-color: rgba(254, 64, 51, 0.1);
            color: #FE4033;
            border: 1px solid #FE4033;
        }

        .platform-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="material-icons" style="vertical-align: middle; margin-right: 8px;">schedule_send</span>
            Post Scheduler
        </h1>
        <div class="form-group">
            <label>
                <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">apps</span>
                Platform
            </label>
            <select id="platform">
                <option value="instagram">
                    Instagram
                </option>
                <option value="facebook">Facebook</option>
            </select>
        </div>
        <div class="form-group">
            <label>
                <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">image</span>
                Image
            </label>
            <div class="image-upload">
                <button id="selectImage">
                    <span class="material-icons">upload_file</span>
                    Select Image
                </button>
                <div id="selectedImage"></div>
            </div>
        </div>
        <div class="form-group">
            <label>
                <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">schedule</span>
                Schedule Time
            </label>
            <input type="datetime-local" id="scheduleTime">
        </div>
        <button id="submitButton">
            <span class="material-icons">send</span>
            Schedule Post
        </button>
        <div id="status"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let selectedImagePath = '';

        document.getElementById('selectImage').addEventListener('click', async () => {
            selectedImagePath = await ipcRenderer.invoke('select-image');
            const fileName = selectedImagePath.split('\\').pop();
            document.getElementById('selectedImage').innerHTML = `
                <span class="material-icons" style="vertical-align: middle; margin-right: 4px; color: #ABD451;">check_circle</span>
                ${fileName}
            `;
        });

        document.getElementById('submitButton').addEventListener('click', () => {
            const scheduledTime = document.getElementById('scheduleTime').value;
            const platform = document.getElementById('platform').value;
            
            if (!selectedImagePath || !scheduledTime) {
                showStatus('Please select an image and schedule time', false);
                return;
            }

            const scheduledDate = new Date(scheduledTime);
            if (scheduledDate < new Date()) {
                showStatus('Please select a future time', false);
                return;
            }

            document.getElementById('submitButton').disabled = true;
            document.getElementById('submitButton').innerHTML = `
                <div class="loading"></div>
                Scheduling...
            `;
            
            ipcRenderer.send('start-post', {
                imagePath: selectedImagePath,
                scheduledTime: scheduledTime,
                platform: platform
            });
        });

        ipcRenderer.on('post-status', (event, { success, message }) => {
            showStatus(message, success);
            document.getElementById('submitButton').disabled = false;
            document.getElementById('submitButton').innerHTML = `
                <span class="material-icons">send</span>
                Schedule Post
            `;
        });

        function showStatus(message, success) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <span class="material-icons">${success ? 'check_circle' : 'error'}</span>
                ${message}
            `;
            statusDiv.className = success ? 'success' : 'error';
        }
    </script>
</body>
</html>
